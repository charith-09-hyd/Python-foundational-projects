<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Desktop Calculator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f3f4f6; margin: 0; padding: 20px; box-sizing: border-box; }
        .app-container { display: flex; gap: 20px; max-width: 800px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-wrap: wrap; }
        .calc-box { flex: 1; min-width: 280px; }
        .screen { width: 100%; height: 60px; background: #1f2937; color: #10b981; font-size: 2rem; text-align: right; padding: 10px; border-radius: 6px; border: none; margin-bottom: 15px; box-sizing: border-box; font-family: monospace; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 20px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 6px; background: #e5e7eb; cursor: pointer; transition: background 0.1s; }
        button:hover { background: #d1d5db; }
        button.operator { background: #f59e0b; color: white; }
        button.operator:hover { background: #d97706; }
        button.equal { background: #10b981; color: white; grid-column: span 2; }
        button.equal:hover { background: #059669; }
        button.clear { background: #ef4444; color: white; }
        button.clear:hover { background: #dc2626; }
        .history-box { flex: 1; min-width: 250px; border-left: 1px solid #e5e7eb; padding-left: 20px; max-height: 400px; overflow-y: auto; }
        h3 { margin-top: 0; color: #374151; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 8px; border-bottom: 1px solid #f3f4f6; font-family: monospace; color: #4b5563; }
        .clear-history { background: none; color: #ef4444; font-size: 0.9rem; font-weight: normal; padding: 5px; cursor: pointer; width: auto; margin-bottom: 10px; }
        .clear-history:hover { background: #fef2f2; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="calc-box">
        <input type="text" class="screen" id="display" readonly value="0">
        <div class="buttons">
            <button class="clear" onclick="clearScreen()">C</button>
            <button onclick="press('(')">(</button>
            <button onclick="press(')')">)</button>
            <button class="operator" onclick="press('/')">/</button>
            
            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('*')">×</button>
            
            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="operator" onclick="press('-')">-</button>
            
            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button class="operator" onclick="press('+')">+</button>
            
            <button onclick="press('0')">0</button>
            <button onclick="press('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>
    
    <div class="history-box">
        <h3>Calculation History</h3>
        <button class="clear-history" onclick="clearHistory()">Clear History</button>
        <ul id="historyList"></ul>
    </div>
</div>

<script>
    let display = document.getElementById('display');
    let historyList = document.getElementById('historyList');
    let isNewCalculation = false;

    // Load history when app starts
    window.onload = function() {
        let savedHistory = JSON.parse(localStorage.getItem('calcHistory')) || [];
        savedHistory.forEach(item => addHistoryToScreen(item));
    };

    function press(val) {
        if (display.value === '0' || isNewCalculation) {
            if (['+', '-', '*', '/'].includes(val)) {
                isNewCalculation = false;
            } else {
                display.value = '';
                isNewCalculation = false;
            }
        }
        display.value += val;
    }

    function clearScreen() {
        display.value = '0';
    }

    function calculate() {
        try {
            let expression = display.value;
            if(!expression || expression === '0') return;
            
            let result = eval(expression);
            display.value = result;
            isNewCalculation = true;

            let log = `${expression} = ${result}`;
            addHistoryToScreen(log);
            saveToMemory(log);
        } catch (err) {
            display.value = 'Error';
            isNewCalculation = true;
        }
    }

    function addHistoryToScreen(text) {
        let li = document.createElement('li');
        li.textContent = text;
        historyList.insertBefore(li, historyList.firstChild);
    }

    function saveToMemory(text) {
        let savedHistory = JSON.parse(localStorage.getItem('calcHistory')) || [];
        savedHistory.push(text);
        localStorage.setItem('calcHistory', JSON.stringify(savedHistory));
    }

    function clearHistory() {
        localStorage.removeItem('calcHistory');
        historyList.innerHTML = '';
    }
</script>

</body>
</html>
